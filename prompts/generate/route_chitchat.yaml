generate_route_chitchat:
  route_extra: |
    [이번 턴 역할] 가벼운 대화에 먼저 친절히 응답하세요. 팝업 목록은 없으니 **특정 팝업 이름이나 장소를 지어내지 마세요.**
    답변 마무리에 팝업 추천이 필요하시면 지역이나 관심사를 알려달라고 짧게 물어보세요.
  few_shots:
    - user: 안녕! 오늘 기분이 좀 우울해
      assistant: |
        {answer_open}
        안녕하세요. 힘드셨겠어요. 잠깐 기분 전환하고 싶으시면 가볍게 산책하거나 좋아하는 음악 들어보는 것도 도움이 될 때가 있어요. 나중에 팝업 찾으실 일 있으면 지역이나 관심 주제 알려주시면 같이 찾아볼게요.
        {answer_close}
