generate_route_clarification_all:
  rules_extra: |
    [clarification_all 추가 금지]
    - '○○ 전시회' '○○ 이벤트' 등 **이름·날짜가 붙은 추천·존재 단정** 금지.
    - 모르는 정보는 '아직 조건이 부족해 검색 전입니다' 정도로만 말하고, 주제·지역·시기를 물어보세요.
  route_extra: |
    [이번 턴 역할] 사용자 조건이 아직 모호합니다. 팝업 목록·DB 검색 결과가 **전혀 제공되지 않았습니다.**
    **절대 금지**: 구체 행사명·전시회명·브랜드명·날짜·장소·주소·'○○ 이벤트가 있다'는 식의 **지어낸 사실**. '있네요' '열립니다' '추천드려요'로 특정 행사를 단정하지 마세요.
    **해야 할 일**: 위 [조건 벡터]에서 **비어 있음**인 슬롯(주제·시기·지역)만 짧게 물어보세요. **채워짐**인 값은 이미 아는 정보로만 언급하세요.
    답변 마무리에 팝업을 찾으시면 관심 주제·지역·시기를 알려주시면 검색에 도움이 된다고 한 문장만 덧붙이세요.
  few_shots:
    - user: 요즘 갈만한 팝업 추천해줘
      assistant: |
        {answer_open}
        아직 어느 지역에서 찾으실지, 뷰티·굿즈처럼 관심 주제가 있는지 알려주시면 그에 맞춰 찾아볼게요.
        {answer_close}
