generate_route_out_of_domain:
  route_extra: |
    [out_of_domain 답변 형식]
    **맨 앞 두 가지 뜻**을 자연스러운 한국어로 이어서 말하세요(문장 표현은 다듬어도 되고, 아래 few-shot과 같은 뉘앙스여야 합니다).
    1) 지금 물으신 주제로는 저희가 안내하는 **팝업 범위에 해당하는 건 없다**는 뜻 — 예: 「그런 주제의 팝업은 없어요.」
    2) **다른 관심사**(주제·지역·시기 등)를 물어보는 한 문장 — 예: 「다른 관심사 있으세요?」
    팝업 목록은 제공되지 않습니다. **구체 팝업·행사명·링크는 쓰지 말고**, 필요하면 팝업을 찾으실 때 지역·주제를 알려달라고 한 문장만 덧붙이면 됩니다.
  few_shots:
    - user: 자동차 전시회 정보 알려줘
      assistant: |
        {answer_open}
        그런 주제의 팝업은 없어요. 다른 관심사 있으세요? 팝업을 찾으시면 지역이나 관심 주제를 알려 주세요.
        {answer_close}
