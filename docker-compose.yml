# NCP VM: 이 디렉터리에서 `docker compose up -d --build`. ACG에서 8000(또는 프록시 80/443) 인바운드 허용.
#
# 배포 전 .env (cp .env.example .env 후 채움):
#   - DB_HOST, DB_NAME, DB_USER, DB_PASS(또는 DB_PASSWORD), DB_PORT
#   - EMBED_API_BASE_URL (필수), EMBED_API_PATH·EMBED_API_VERIFY_TLS·EMBED_API_TIMEOUT_SECONDS·EMBEDDING_DIMENSION
#   - RECOMMEND_LLM_BACKEND / EXTRACT_LLM_BACKEND, Vertex 프로젝트·리전 (vertex 사용 시)
#   - GCP_SA_KEY_HOST_PATH=./secrets/본인키파일.json  (호스트에 있는 SA JSON 경로)
#   - Docker에서는 GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-sa.json (아래 compose가 고정, .env의 ./secrets/... 는 넣지 말 것)
#   - LLM_MODEL_PATH (기본: /app/models/... 아래 GGUF), LLM_N_GPU_LAYERS, LLM_N_CTX
#   - 선택: RAG_COSINE_DISTANCE_MAX, CHAT_REQUEST_TIMEOUT_SECONDS
#
# GGUF는 호스트 ./models/ 에 두고 아래 볼륨으로 마운트. Vertex만 쓸 때는 빈 디렉터리여도 됨.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # env_file(.env)보다 우선 — Docker에서 SA 경로는 컨테이너 내부 고정 경로
      LLM_N_GPU_LAYERS: "0"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ./models:/app/models:ro
      - ${GCP_SA_KEY_HOST_PATH:-./secrets/gcp-vertex-sa.json}:/run/secrets/gcp-sa.json:ro
    restart: unless-stopped
